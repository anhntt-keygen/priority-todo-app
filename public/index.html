<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priority Todo App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tight mb-2">🎯 Priority Todo App</h1>
      <p class="text-slate-500">Quản lý công việc thông minh, phân loại ưu tiên & đồng bộ tức thì</p>
      <div class="mt-2 inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200" data-testid="todo-local-status">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Đã đồng bộ LocalStorage & Cloud
      </div>
    </header>

    <!-- Thống kê & Tiến độ -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6" data-testid="todo-stats">
      <h2 class="text-lg font-bold text-slate-700 mb-4">📊 Tổng quan tiến độ</h2>
      <div class="w-full bg-slate-100 rounded-full h-4 mb-6 overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-slate-50 p-3 rounded-xl text-center border border-slate-100">
          <span class="block text-2xl font-extrabold text-slate-700" id="stat-total">0</span>
          <span class="text-xs text-slate-500 font-medium">Tổng công việc</span>
        </div>
        <div class="bg-rose-50 p-3 rounded-xl text-center border border-rose-100">
          <span class="block text-2xl font-extrabold text-rose-600" id="stat-high">0</span>
          <span class="text-xs text-rose-500 font-medium">Ưu tiên Cao</span>
        </div>
        <div class="bg-amber-50 p-3 rounded-xl text-center border border-amber-100">
          <span class="block text-2xl font-extrabold text-amber-600" id="stat-medium">0</span>
          <span class="text-xs text-amber-500 font-medium">Trung bình</span>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl text-center border border-emerald-100">
          <span class="block text-2xl font-extrabold text-emerald-600" id="stat-low">0</span>
          <span class="text-xs text-emerald-500 font-medium">Ưu tiên Thấp</span>
        </div>
      </div>
    </section>

    <!-- Form Thêm Công Việc -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6">
      <h2 class="text-lg font-bold text-slate-700 mb-4">➕ Thêm công việc mới</h2>
      <form id="todo-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Tên công việc -->
          <div class="md:col-span-1">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tên công việc</label>
            <input type="text" id="todo-input" data-testid="todo-input" required placeholder="Ví dụ: Học lập trình Node.js..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
          </div>
          <!-- Mức độ ưu tiên -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mức độ ưu tiên</label>
            <select id="todo-priority-select" data-testid="todo-priority-select" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-white">
              <option value="high">🔥 High (Cao)</option>
              <option value="medium" selected>⚡ Medium (Trung bình)</option>
              <option value="low">🌱 Low (Thấp)</option>
            </select>
          </div>
          <!-- Hạn chót -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Hạn chót (Due Date)</label>
            <input type="date" id="todo-date" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
          </div>
        </div>
        <button type="submit" data-testid="todo-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2">
          Thêm vào danh sách
        </button>
      </form>
    </section>

    <!-- Bộ lọc & Sắp xếp -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex flex-wrap items-center gap-4">
          <!-- Lọc trạng thái -->
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Trạng thái</label>
            <div class="inline-flex rounded-lg p-1 bg-slate-100">
              <button class="filter-status-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-slate-800 shadow-sm" data-status="all">Tất cả</button>
              <button class="filter-status-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-800" data-status="active">Đang làm</button>
              <button class="filter-status-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-800" data-status="completed">Đã xong</button>
            </div>
          </div>
          <!-- Lọc mức độ ưu tiên -->
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Mức độ ưu tiên</label>
            <select id="todo-filter-priority" data-testid="todo-filter-priority" class="px-3 py-1.5 rounded-lg border border-slate-200 text-sm font-medium bg-white outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="all">Tất cả ưu tiên</option>
              <option value="high">High (Cao)</option>
              <option value="medium">Medium (Trung bình)</option>
              <option value="low">Low (Thấp)</option>
            </select>
          </div>
        </div>
        <!-- Sắp xếp -->
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Sắp xếp theo</label>
          <select id="todo-sort" class="px-3 py-1.5 rounded-lg border border-slate-200 text-sm font-medium bg-white outline-none focus:ring-2 focus:ring-indigo-500 w-full md:w-auto">
            <option value="priority-desc">Ưu tiên: Cao -> Thấp</option>
            <option value="priority-asc">Ưu tiên: Thấp -> Cao</option>
            <option value="date-asc">Hạn chót: Gần nhất</option>
            <option value="date-desc">Hạn chót: Xa nhất</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Danh sách công việc -->
    <main>
      <div id="todo-list" class="space-y-3">
        <!-- Các công việc sẽ được render động tại đây -->
      </div>
      <!-- Trạng thái trống -->
      <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200">
        <p class="text-slate-400 text-lg">Không tìm thấy công việc nào phù hợp!</p>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
```
